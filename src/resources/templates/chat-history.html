<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="SkillSwap Chat History">
    <meta name="keywords" content="chat, messages, skillswap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title th:text="#{chat.history.title}">Chat History - SkillSwap</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
    <link rel="stylesheet" href="/css/chat-history.css" type="text/css">
    <link rel="stylesheet" href="/css/chat-reactions.css" type="text/css">

    <style>
        @media (max-width: 768px) {
            .search-model-form input {
                height: 50px;
                padding: 0 20px;
                line-height: 50px;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

    <div class="mobile-chat-header" id="mobileChatHeader">
        <button class="back-btn" type="button" onclick="goBackToList()" th:attr="aria-label=#{chat.history.back}">←</button>
        <img class="chat-avatar" id="mobileChatAvatar" src="/img/default-avatar.png" alt="User avatar">
        <div class="chat-user-info">
            <span class="chat-name" id="mobileChatName" th:text="#{chat.history.select}">Selectează o conversație</span>
            <span class="chat-status" id="mobileChatStatus" th:text="#{chat.history.offline}">Offline</span>
        </div>
        <div class="chat-actions">
            <button class="chat-action-btn call-action-btn"
                    id="mobileStartCallButton"
                    data-video-call-trigger="true"
                    type="button"
                    th:attr="aria-label=#{chat.history.call}">
                <i class="fa fa-phone" aria-hidden="true"></i>
            </button>
            <div class="chat-settings-wrapper">
                <button class="chat-action-btn settings-action-btn" type="button" th:attr="aria-label=#{chat.history.settings}" aria-expanded="false">
                    <i class="fa fa-ellipsis-v" aria-hidden="true"></i>
                </button>
                <div class="chat-settings-dropdown" role="menu" th:attr="aria-label=#{chat.history.settings}">
                    <button type="button" class="chat-settings-item" data-chat-action="mute" role="menuitem" th:text="#{chat.history.mute}">Mute</button>
                    <button type="button" class="chat-settings-item" data-chat-action="block" role="menuitem" th:text="#{chat.history.block}">Block</button>
                    <button type="button" class="chat-settings-item" data-chat-action="report" role="menuitem" th:text="#{chat.history.report}">Report</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Chat History Section Begin -->
    <section class="chat-history-section spad">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="chat-history-container">
                        <!-- Sidebar - Conversations List -->
                        <div class="chat-sidebar">
                            <!-- Search Bar -->
                            <div class="chat-search-wrapper">
                                <div class="inputBox_container">
                                    <svg class="search_icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" alt="search icon">
                                        <path d="M46.599 46.599a4.498 4.498 0 0 1-6.363 0l-7.941-7.941C29.028 40.749 25.167 42 21 42 9.402 42 0 32.598 0 21S9.402 0 21 0s21 9.402 21 21c0 4.167-1.251 8.028-3.342 11.295l7.941 7.941a4.498 4.498 0 0 1 0 6.363zM21 6C12.717 6 6 12.714 6 21s6.717 15 15 15c8.286 0 15-6.714 15-15S29.286 6 21 6z"></path>
                                    </svg>
                                    <input class="inputBox" id="inputBox" type="text" th:attr="placeholder=#{chat.history.search}">
                                </div>
                            </div>

                            <!-- Conversations List -->
                            <div class="conversations-list" id="conversationsList">
                                <!-- Conversations are loaded dynamically from /api/chat/rooms -->
                            </div>
                        </div>

                        <!-- Chat Area -->
                        <div class="chat-area chat-window" id="chatWindow">
                            <!-- Chat Header -->
                            <div class="chat-header" id="chatHeader">
                                <div class="chat-header-user">
                                    <div class="chat-header-avatar">
                                        <img src="/img/details/comment/comment-1.jpg" alt="User" id="chatHeaderAvatar">
                                        <span class="status-indicator status-offline" id="chatHeaderStatus"></span>
                                    </div>
                                    <div class="chat-header-info">
                                        <h5 class="chat-header-name" id="chatHeaderName" th:text="#{chat.history.select}">Selectează o conversație</h5>
                                        <span class="chat-header-status-text" id="chatHeaderStatusText" th:text="#{chat.history.offline}">Offline</span>
                                    </div>
                                </div>
                                <div class="chat-header-actions">
                                    <button class="chat-action-btn call-action-btn"
                                            id="startCallButton"
                                            data-video-call-trigger="true"
                                            type="button"
                                            th:attr="title=#{chat.history.call}">
                                        <i class="fa fa-phone"></i>
                                    </button>
                                    <div class="chat-settings-wrapper">
                                        <button class="chat-action-btn settings-action-btn" type="button" th:attr="title=#{chat.history.settings}" th:attrappend="aria-label=#{chat.history.settings}" aria-expanded="false">
                                            <i class="fa fa-ellipsis-v"></i>
                                        </button>
                                        <div class="chat-settings-dropdown" role="menu" th:attr="aria-label=#{chat.history.settings}">
                                            <button type="button" class="chat-settings-item" data-chat-action="mute" role="menuitem" th:text="#{chat.history.mute}">Mute</button>
                                            <button type="button" class="chat-settings-item" data-chat-action="block" role="menuitem" th:text="#{chat.history.block}">Block</button>
                                            <button type="button" class="chat-settings-item" data-chat-action="report" role="menuitem" th:text="#{chat.history.report}">Report</button>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <!-- Messages Container -->
                            <div class="messages-container" id="messagesContainer">
                                <!-- Messages are loaded dynamically for selected conversation -->
                            </div>

                            <!-- Message Input Area -->
                            <div class="message-input-area">
                                <form id="messageForm" class="message-form">
                                    <div class="message-input-wrapper">
                                        <textarea id="messageInput" class="message-input"
                                            th:attr="placeholder=#{chat.history.type}" rows="1"></textarea>
                                        <button type="submit" class="message-send-btn">
                                            <i class="fa fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Chat History Section End -->

    <!-- Js Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/jquery-3.3.1.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/circle-progress.min.js"></script>
    <script src="/js/jquery.barfiller.js"></script>
    <script src="/js/jquery.slicknav.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/chat-websocket.js"></script>
    <script src="/js/chat-history.js"></script>
</body>

</html>
