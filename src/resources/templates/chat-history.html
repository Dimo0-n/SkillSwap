<!DOCTYPE html>
<html lang="zxx" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="SkillSwap Chat History">
    <meta name="keywords" content="chat, messages, skillswap">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Chat History - SkillSwap</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
    <link rel="stylesheet" href="/css/chat-history.css" type="text/css">
    <link rel="stylesheet" href="/css/chat-reactions.css" type="text/css">

    <style>
        @media (max-width: 768px) {
            .search-model-form input {
                height: 50px;
                padding: 0 20px;
                line-height: 50px;
                box-sizing: border-box;
            }
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

    <div class="mobile-chat-header" id="mobileChatHeader">
        <button class="back-btn" type="button" onclick="goBackToList()" aria-label="Înapoi la conversații">←</button>
        <img class="chat-avatar" id="mobileChatAvatar" src="/img/default-avatar.png" alt="User avatar">
        <div class="chat-user-info">
            <span class="chat-name" id="mobileChatName">Selectează o conversație</span>
            <span class="chat-status" id="mobileChatStatus">Offline</span>
        </div>
        <div class="chat-actions">
            <i class="fa fa-video-camera video-icon" aria-hidden="true"></i>
            <i class="fa fa-phone phone-icon" aria-hidden="true"></i>
            <i class="fa fa-ellipsis-v details-icon" aria-hidden="true"></i>
        </div>
    </div>

    <!-- Chat History Section Begin -->
    <section class="chat-history-section spad">
        <div class="container-fluid">
            <div class="row">
                <div class="col-12">
                    <div class="chat-history-container">
                        <!-- Sidebar - Conversations List -->
                        <div class="chat-sidebar">
                            <!-- Search Bar -->
                            <div class="chat-search-wrapper">
                                <div class="chat-search-input-wrapper">
                                    <i class="fa fa-search chat-search-icon"></i>
                                    <input type="text" id="conversationSearch" class="chat-search-input"
                                        placeholder="Search conversations…">
                                </div>
                            </div>

                            <!-- Conversations List -->
                            <div class="conversations-list" id="conversationsList">
                                <!-- Conversations are loaded dynamically from /api/chat/rooms -->
                            </div>
                        </div>

                        <!-- Chat Area -->
                        <div class="chat-area chat-window" id="chatWindow">
                            <!-- Chat Header -->
                            <div class="chat-header" id="chatHeader">
                                <div class="chat-header-user">
                                    <div class="chat-header-avatar">
                                        <img src="/img/details/comment/comment-1.jpg" alt="User" id="chatHeaderAvatar">
                                        <span class="status-indicator status-offline" id="chatHeaderStatus"></span>
                                    </div>
                                    <div class="chat-header-info">
                                        <h5 class="chat-header-name" id="chatHeaderName">Selectează o conversație</h5>
                                        <span class="chat-header-status-text" id="chatHeaderStatusText">Offline</span>
                                    </div>
                                </div>
                                <div class="chat-header-actions">
                                    <button class="call-button" id="startCallButton" title="Start video call/meeting">
                                        <i class="fa fa-video-camera"></i>
                                    </button>
                                </div>
                            </div>

                            <!-- Messages Container -->
                            <div class="messages-container" id="messagesContainer">
                                <!-- Messages are loaded dynamically for selected conversation -->
                            </div>

                            <!-- Message Input Area -->
                            <div class="message-input-area">
                                <form id="messageForm" class="message-form">
                                    <div class="message-input-wrapper">
                                        <textarea id="messageInput" class="message-input"
                                            placeholder="Type a message…" rows="1"></textarea>
                                        <button type="submit" class="message-send-btn">
                                            <i class="fa fa-paper-plane"></i>
                                        </button>
                                    </div>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Chat History Section End -->

    <!-- Search model Begin -->
    <div class="search-model">
        <div class="h-100 d-flex align-items-center justify-content-center">
            <div class="search-close-switch">+</div>
            <form class="search-model-form">
                <input type="text" id="search-input" placeholder="Search here.....">
            </form>
        </div>
    </div>
    <!-- Search model end -->

    <!-- Js Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
    <script src="/js/jquery-3.3.1.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/circle-progress.min.js"></script>
    <script src="/js/jquery.barfiller.js"></script>
    <script src="/js/jquery.slicknav.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/chat-websocket.js"></script>
    <script src="/js/chat-history.js"></script>
</body>

</html>
