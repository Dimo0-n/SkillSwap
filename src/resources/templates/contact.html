<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Amin Template">
    <meta name="keywords" content="Amin, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SkillSwap</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">

    <style>
        .contact-message-group {
            margin-bottom: 18px;
        }

        .contact-message-group textarea {
            margin-bottom: 6px !important;
        }

        .contact-char-counter {
            text-align: left;
            font-family: "Space Grotesk", sans-serif;
            font-size: 12px;
            color: #a0a0b8;
            margin-top: 0;
            padding-left: 2px;
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

    <!-- Contact Section Begin -->
    <section class="contact-section spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-12">
                    <div class="contact-text">
                        <div class="contact-title">
                            <h3 th:text="#{contact.title}">Contact us</h3>
                            <p th:text="#{contact.subtitle}">My experience with Realy is absolutely positive.</p>
                        </div>
                        <div class="contact-form">
                            <div class="dt-leave-comment">
                                <form th:action="@{/contact/faq}" method="post" th:object="${contact}">
                                    <div class="input-list">
                                        <input th:field="*{fullName}" type="text" th:attr="placeholder=#{contact.fullname}" name="fullName">
                                        <input th:field="*{email}" type="text" th:attr="placeholder=#{contact.email}" name="email">
                                    </div>
                                    <div class="contact-message-group">
                                        <textarea th:field="*{message}" id="contactMessage" maxlength="300" th:attr="placeholder=#{contact.message}"></textarea>
                                        <div class="contact-char-counter">
                                            <span id="contactMessageCharCount">0</span> / 300 caractere
                                        </div>
                                    </div>
                                    <button type="submit" th:text="#{contact.submit}">Submit</button>
                                </form>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <!-- Contact Section End -->

    <div th:replace="~{/fragments/about :: about}"></div>

    <!-- Search model Begin -->
    <div class="search-model">
        <div class="h-100 d-flex align-items-center justify-content-center">
            <div class="search-close-switch">+</div>
            <form class="search-model-form">
                <input type="text" id="search-input" th:attr="placeholder=#{common.search.placeholder}">
            </form>
        </div>
    </div>
    <!-- Search model end -->

    <!-- Js Plugins -->
    <script src="/js/jquery-3.3.1.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/circle-progress.min.js"></script>
    <script src="/js/jquery.barfiller.js"></script>
    <script src="/js/jquery.slicknav.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function () {
            const messageField = document.getElementById('contactMessage');
            const messageCharCount = document.getElementById('contactMessageCharCount');

            if (!messageField || !messageCharCount) {
                return;
            }

            const maxLength = Number(messageField.getAttribute('maxlength')) || 300;

            function updateMessageCharCount() {
                if (messageField.value.length > maxLength) {
                    messageField.value = messageField.value.substring(0, maxLength);
                }

                const count = messageField.value.length;
                messageCharCount.textContent = String(count);

                const counter = messageCharCount.closest('.contact-char-counter');
                if (!counter) {
                    return;
                }

                if (count > 270) {
                    counter.style.color = '#ff6b6b';
                } else if (count > 225) {
                    counter.style.color = '#ffa500';
                } else {
                    counter.style.color = '#a0a0b8';
                }
            }

            messageField.addEventListener('input', updateMessageCharCount);
            updateMessageCharCount();
        });
    </script>
    <script src="/js/main.js"></script>
</body>

</html>
