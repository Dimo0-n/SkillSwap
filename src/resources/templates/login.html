<!DOCTYPE html>
<html lang="ro">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Skill Swap</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 25%, #533483 50%, #7b4397 75%, #dc2430 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            overflow: hidden;
        }

        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(139, 69, 195, 0.3);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(75, 0, 130, 0.4);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            z-index: 1;
        }

        .login-container {
            background: rgba(30, 30, 30, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 450px;
            position: relative;
            z-index: 10;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(139, 69, 195, 0.3);
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            width: 35px;
            height: 35px;
            background: #8b45c3;
            border: none;
            border-radius: 50%;
            color: white;
            font-size: 18px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .close-btn:hover {
            background: #a855f7;
            transform: scale(1.1);
        }

        .login-title {
            text-align: center;
            margin-bottom: 30px;
            color: #8b45c3;
            font-size: 2.5rem;
            font-weight: bold;
            text-shadow: 0 0 20px rgba(139, 69, 195, 0.5);
        }

        .form-group {
            margin-bottom: 20px;
            position: relative;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #e0e0e0;
            font-weight: 500;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            background: rgba(255, 255, 255, 0.1);
            border: 2px solid rgba(139, 69, 195, 0.3);
            border-radius: 10px;
            color: white;
            font-size: 16px;
            transition: all 0.3s ease;
            outline: none;
        }

        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .form-group input:focus {
            border-color: #8b45c3;
            box-shadow: 0 0 15px rgba(139, 69, 195, 0.4);
            background: rgba(255, 255, 255, 0.15);
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #8b45c3, #a855f7);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(139, 69, 195, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
            color: #e0e0e0;
            font-size: 14px;
        }

        .login-link a {
            color: #8b45c3;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .login-link a:hover {
            color: #a855f7;
        }
    </style>
</head>
<body>
<div class="login-container">
    <button class="close-btn" onclick="window.location.href='/index'">&times;</button>

    <h2 class="login-title">Login</h2>

    <form method="POST" action="/login" id="loginForm">
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" name="username" placeholder="Introduceți adresa de email" required>
        </div>

        <div class="form-group">
            <label for="password">Parolă</label>
            <input type="password" id="password" name="password" placeholder="Introduceți parola" required>
        </div>

        <button type="submit" class="login-btn">Conectează-te</button>

        <div class="login-link">
            Nu ai cont? <a th:href="@{/register}">Înregistrează-te</a>
        </div>
    </form>
</div>

<div id="message" class="message"></div>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    if(urlParams.has('error')) {
        showMessage('Email sau parola incorectă!', 'error');
    }
    if(urlParams.has('logout')) {
        showMessage('Te-ai deconectat cu succes!', 'success');
    }

    function showMessage(text, type='error') {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = `message ${type} show`;
        setTimeout(() => messageDiv.classList.remove('show'), 4000);
    }
</script>

<style>
    /* Stil pentru mesaj exact ca la register */
    .message {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        padding: 15px 30px;
        border-radius: 10px;
        color: white;
        font-weight: 500;
        z-index: 1000;
        opacity: 0;
        transition: all 0.3s ease;
        min-width: 300px;
        text-align: center;
    }

    .message.show {
        opacity: 1;
        animation: slideDown 0.3s ease;
    }

    .message.success {
        background: linear-gradient(135deg,#10b981,#059669);
        border: 1px solid #34d399;
    }

    .message.error {
        background: linear-gradient(135deg,#ef4444,#dc2626);
        border: 1px solid #f87171;
    }

    @keyframes slideDown {
        from { transform: translateX(-50%) translateY(-100%); }
        to { transform: translateX(-50%) translateY(0); }
    }
</style>
</body>
</html>
