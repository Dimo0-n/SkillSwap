<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{login.title} + ' - Skill Swap'">Login - Skill Swap</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/login.css" type="text/css">
</head>

<body>
    <div class="login-container">
        <button class="close-btn" onclick="window.location.href='/index'">&times;</button>

        <h2 class="login-title" th:text="#{login.title}">Login</h2>

        <form method="POST" th:action="@{/login}" id="loginForm">
            <div class="form-group">
                <label for="email" th:text="#{login.email}">Email</label>
                <input type="email" id="email" name="username" th:attr="placeholder=#{login.email.placeholder}" required>
            </div>

            <div class="form-group">
                <label for="password" th:text="#{login.password}">Parolă</label>
                <input type="password" id="password" name="password" th:attr="placeholder=#{login.password.placeholder}" required>
            </div>

            <button type="submit" class="login-btn" th:text="#{login.submit}">Conectează-te</button>

            <div class="divider">
                <span th:text="#{login.or}">sau</span>
            </div>

            <!-- Google Login -->
            <a href="/oauth2/authorization/google" class="google-btn">
                <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
                <span th:text="#{login.google}">Conectează-te cu Google</span>
            </a>

            <div class="login-link">
                <span th:text="#{login.no.account}">Nu ai cont?</span> <a th:href="@{/register}" th:text="#{login.register.link}">Înregistrează-te</a>
            </div>
        </form>
    </div>

    <div id="message" class="message"></div>

    <script th:inline="javascript">
        const urlParams = new URLSearchParams(window.location.search);

        if (urlParams.has('errorMessage')) {
            // Mesaj custom (ex: user Google încearcă login clasic)
            showMessage(urlParams.get('errorMessage'), 'error');

        } else if (urlParams.has('error')) {
            // Mesaj generic (parolă greșită etc.)
            showMessage(/*[[#{login.error.invalid}]]*/ 'Email sau parola incorectă!', 'error');
        }

        if (urlParams.has('logout')) {
            showMessage(/*[[#{login.success.logout}]]*/ 'Te-ai deconectat cu succes!', 'success');
        }

        function showMessage(text, type = 'error') {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type} show`;
            setTimeout(() => messageDiv.classList.remove('show'), 4000);
        }
    </script>

</body>

</html>
