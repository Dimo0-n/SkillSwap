<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Subscribe</title>
</head>
<body>

<div th:fragment="subscribe">
    <div class="subscribe-option">
        <div class="section-title">
            <h5 th:text="#{subscribe.title}">Abonează-te</h5>
        </div>
        <p th:text="#{subscribe.subtitle}">Așteaptă cele mai noi actualizări direct pe emailul tău</p>
        <form action="#">
            <input type="text" th:attr="placeholder=#{subscribe.name.placeholder}">
            <input type="text" th:attr="placeholder=#{subscribe.email.placeholder}">
            <button type="submit"><span th:text="#{subscribe.button}">Abonează-te</span></button>
        </form>
    </div>
</div>

</body>
</html>
