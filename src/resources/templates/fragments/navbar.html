<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>NavBar</title>

    <style>
        .nav-options {
            background: linear-gradient(to bottom, #7b2cbf, #5a189a);
        }

        .nav-menu ul li a {
            background: linear-gradient(to bottom, #9d4edd, #7b2cbf);
        }

        .nav-menu ul li.active a {
            background: linear-gradient(to bottom, #c77dff, #9d4edd);
        }
    </style>

</head>

<body>

    <div th:fragment="navbar">
        <!-- Header Section Begin -->
        <header class="header-section">
            <div class="ht-options">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-6 col-md-8">
                            <div class="ht-widget">
                                <ul sec:authorize="!isAuthenticated()">
                                    <li>
                                        <a th:href="@{/login}"><i class="fa fa-sign-in"></i> <span th:text="#{navbar.login}">Login</span></a>
                                    </li>
                                <li class="sep">/</li>
                                    <li>
                                        <a th:href="@{/register}"><i class="fa fa-user-plus"></i> <span th:text="#{navbar.register}">Sign up</span></a>
                                    </li>
                                </ul>
                                <ul sec:authorize="isAuthenticated()">
                                    <li>
                                        <a href="#"
                                            onclick="event.preventDefault(); document.getElementById('logoutForm').submit();"><i
                                                class="fa fa-power-off"></i> <span th:text="#{navbar.logout}">Logout</span></a>
                                    </li>
                                <li class="sep" sec:authorize="hasAuthority('ROLE_ADMIN')">/</li>
                                    <li>
                                    <a sec:authorize="hasAuthority('ROLE_ADMIN')" th:href="@{/admin}"><i
                                                class="fa fa-shield"></i><span th:text="#{navbar.admin}">Admin</span></a>
                                    </li>
                                </ul>
                                <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;">
                                </form>

                                <div class="mobile-lang-wrap">
                                    <select class="form-control form-control-sm lang-select-mobile"
                                            onchange="window.location.search='?lang=' + this.value;"
                                            aria-label="Language selector">
                                        <option value="ro" th:selected="${#locale.language == 'ro'}" th:text="#{lang.ro}">RO</option>
                                        <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">EN</option>
                                        <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{lang.fr}">FR</option>
                                        <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{lang.ru}">RU</option>
                                    </select>
                                </div>

                            </div>
                        </div>

                        <script sec:authorize="isAuthenticated()" src="/js/user-timezone.js"></script>
                        <!-- Notifications JS -->
                        <script src="/js/notifications.js"></script>

                        <div class="col-lg-6 col-md-4">
                            <div class="ht-social">
                                <a href="#"><i class="fa fa-facebook"></i></a>
                                <a href="#"><i class="fa fa-twitter"></i></a>
                                <a href="#"><i class="fa fa-youtube-play"></i></a>
                                <a href="#"><i class="fa fa-instagram"></i></a>
                                <a href="#"><i class="fa fa-envelope-o"></i></a>
                                <span class="sep">/</span>
                                <select class="form-control form-control-sm d-inline-block w-auto lang-select-desktop"
                                        onchange="window.location.search='?lang=' + this.value;"
                                        aria-label="Language selector">
                                    <option value="ro" th:selected="${#locale.language == 'ro'}" th:text="#{lang.ro}">RO</option>
                                    <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">EN</option>
                                    <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{lang.fr}">FR</option>
                                    <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{lang.ru}">RU</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="nav-options">
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-left">
                            <button class="humberger-menu humberger-open" type="button" th:attr="aria-label=#{navbar.open.menu}">
                                <i class="fa fa-bars"></i>
                            </button>
                            <a href="/index" class="nav-logo">
                                <img class="site-logo" src="/img/skill-swap-logo-cameleon.png" alt="SkillSwap logo">
                            </a>
                        </div>
                        <div class="nav-center">
                            <div class="nav-menu">
                                <ul>
                                    <li><a th:href="@{/index}"><span th:text="#{navbar.home}">Acasă</span></a></li>
                                    <li><a th:href="@{/announces-list}"><span th:text="#{navbar.announces}">Anunțuri</span></a></li>
                                    <!--                    <li><a sec:authorize="isAuthenticated()" th:href="@{/chat}"><span>Chat</i></span></a></li>-->
                                    <li><a th:href="@{/contact}"><span th:text="#{navbar.contact}">Contact</span></a></li>
                                    <li><a sec:authorize="isAuthenticated()" th:href="@{/profile}"><span th:text="#{navbar.profile}">Profil</span></a></li>
                                </ul>
                            </div>
                            <a th:href="@{/announces/new}" class="btn-create-announce"><span th:text="#{navbar.create}">+ Creează anunț</span></a>
                            <div class="nav-right">
                                <!-- Conversations Button -->
                                <a th:href="@{/chat-history}" class="btn-conversations"
                                    sec:authorize="isAuthenticated()" th:attr="aria-label=#{navbar.conversations}">
                                    <i class="fa fa-comments"></i>
                                    <span class="conversation-badge hidden" id="conversationBadge"></span>
                                </a>

                                <!-- Notifications Button -->
                                <div class="notifications-wrapper" sec:authorize="isAuthenticated()">
                                    <button class="btn-notifications" type="button" id="notificationsButton"
                                        th:attr="aria-label=#{navbar.notifications}">
                                        <i class="fa fa-bell"></i>
                                        <span class="notification-badge" id="notificationBadge"></span>
                                    </button>
                                    <!-- Notifications Dropdown -->
                                    <div class="notifications-dropdown" id="notificationsDropdown">
                                        <div class="notifications-header">
                                            <button class="notifications-mobile-btn notifications-mobile-back" id="notificationsMobileBack" type="button" th:attr="aria-label=#{chat.history.back}">
                                                <i class="fa fa-arrow-left"></i>
                                            </button>
                                            <div class="notifications-mobile-title-wrap">
                                                <h6 class="notifications-mobile-title">Notificări</h6>
                                                <span class="notifications-mobile-unread-badge hidden" id="notificationsMobileUnreadBadge">0</span>
                                            </div>
                                            <button class="notifications-mobile-btn notifications-mobile-menu" type="button" th:attr="aria-label=#{chat.history.settings}">
                                                <i class="fa fa-ellipsis-v"></i>
                                            </button>
                                            <h6 th:text="#{navbar.notifications}">Notificări</h6>
                                            <button class="notifications-mark-all" id="notificationsMarkAll" type="button" disabled
                                                    th:text="#{navbar.notifications.markAll}"
                                                    th:attr="aria-label=#{navbar.notifications.markAll}">
                                                Marchează toate
                                            </button>
                                        </div>
                                        <div class="notifications-list" id="notificationsList">
                                            <!-- Notification items will be dynamically inserted here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="navbar-search-panel" id="navbarSearchPanel">
                    <form class="navbar-search-form" th:action="@{/announces-list}" method="get">
                        <!-- Folosește același endpoint de filtrare ca bara principală de căutare -->
                        <input type="text" id="navbar-search-input" name="query" th:attr="placeholder=#{navbar.search.placeholder}"
                            th:attrappend="aria-label=#{navbar.search.placeholder}">
                        <button type="submit" th:attr="aria-label=#{navbar.search.submit}">
                            <i class="fa fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
    </div>
    </header>
    <!-- Mobile Notifications Panel -->
    <div class="mobile-notifications-panel" id="mobileNotificationsPanel" aria-hidden="true">
        <div class="mobile-notifications-panel__header">
            <button class="mnp-btn mnp-btn--back" id="mnpBackBtn" type="button" aria-label="Înapoi">
                <i class="fa fa-arrow-left"></i>
            </button>
            <div class="mnp-title-wrap">
                <span class="mnp-title">Notificări</span>
                <span class="mnp-unread-badge hidden" id="mnpUnreadBadge">0</span>
            </div>
            <button class="mnp-btn mnp-btn--menu" id="mnpMenuBtn" type="button" aria-label="Opțiuni">
                <i class="fa fa-ellipsis-v"></i>
            </button>
        </div>
        <div class="mobile-notifications-panel__list" id="mobileNotificationsList">
        </div>
    </div>
    <!-- Header End -->

    <script sec:authorize="isAuthenticated()">
        (function () {
            const heartbeatIntervalMs = 20000;
            let heartbeatTimer = null;

            if (window.SkillSwapUserTimeZone && typeof window.SkillSwapUserTimeZone.start === 'function') {
                window.SkillSwapUserTimeZone.start();
            }

            function detectBrowserTimeZone() {
                try {
                    const detected = Intl.DateTimeFormat().resolvedOptions().timeZone;
                    return typeof detected === 'string' && detected.trim() ? detected.trim() : '';
                } catch (_) {
                    return '';
                }
            }

            function sendPresenceHeartbeat() {
                const timeZoneId = detectBrowserTimeZone();
                const headers = {
                    'Accept': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest'
                };

                if (timeZoneId) {
                    headers['X-Time-Zone'] = timeZoneId;
                }

                fetch('/api/presence/ping', {
                    method: 'POST',
                    headers: headers,
                    credentials: 'same-origin',
                    keepalive: true
                }).catch(function () {
                    // Ignore transient network errors.
                });
            }

            function startHeartbeat() {
                if (heartbeatTimer) {
                    return;
                }

                sendPresenceHeartbeat();
                heartbeatTimer = window.setInterval(sendPresenceHeartbeat, heartbeatIntervalMs);
            }

            function stopHeartbeat() {
                if (!heartbeatTimer) {
                    return;
                }

                window.clearInterval(heartbeatTimer);
                heartbeatTimer = null;
            }

            document.addEventListener('visibilitychange', function () {
                if (document.hidden) {
                    stopHeartbeat();
                } else {
                    startHeartbeat();
                }
            });

            window.addEventListener('focus', startHeartbeat);
            window.addEventListener('blur', function () {
                // Keep a small overlap; scheduler will move offline on inactivity.
            });

            startHeartbeat();
        })();
    </script>
    </div>

</body>

</html>
