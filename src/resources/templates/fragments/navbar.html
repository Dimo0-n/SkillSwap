<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>NavBar</title>

    <style>
        .nav-options {
            background: linear-gradient(to bottom, #7b2cbf, #5a189a);
        }

        .nav-menu ul li a {
            background: linear-gradient(to bottom, #9d4edd, #7b2cbf);
        }

        .nav-menu ul li.active a {
            background: linear-gradient(to bottom, #c77dff, #9d4edd);
        }
    </style>

</head>

<body>

    <div th:fragment="navbar">
        <!-- Header Section Begin -->
        <header class="header-section">
            <div class="ht-options">
                <div class="container">
                    <div class="row">
                        <div class="col-lg-6 col-md-8">
                            <div class="ht-widget">
                                <ul sec:authorize="!isAuthenticated()">
                                    <li>
                                        <a th:href="@{/login}"><i class="fa fa-sign-in"></i> <span th:text="#{navbar.login}">Login</span></a>
                                    </li>
                                <li class="sep">/</li>
                                    <li>
                                        <a th:href="@{/register}"><i class="fa fa-user-plus"></i> <span th:text="#{navbar.register}">Sign up</span></a>
                                    </li>
                                </ul>
                                <ul sec:authorize="isAuthenticated()">
                                    <li>
                                        <a href="#"
                                            onclick="event.preventDefault(); document.getElementById('logoutForm').submit();"><i
                                                class="fa fa-power-off"></i> <span th:text="#{navbar.logout}">Logout</span></a>
                                    </li>
                                <li class="sep" sec:authorize="hasRole('ROLE_ADMIN')">/</li>
                                    <li>
                                        <a sec:authorize="hasRole('ROLE_ADMIN')" th:href="@{/admin}"><i
                                                class="fa fa-shield"></i><span th:text="#{navbar.admin}">Admin</span></a>
                                    </li>
                                </ul>
                                <form id="logoutForm" th:action="@{/logout}" method="post" style="display: none;">
                                </form>

                            </div>
                        </div>

                        <!-- Notifications JS -->
                        <script src="/js/notifications.js"></script>

                        <div class="col-lg-6 col-md-4">
                            <div class="ht-social">
                                <a href="#"><i class="fa fa-facebook"></i></a>
                                <a href="#"><i class="fa fa-twitter"></i></a>
                                <a href="#"><i class="fa fa-youtube-play"></i></a>
                                <a href="#"><i class="fa fa-instagram"></i></a>
                                <a href="#"><i class="fa fa-envelope-o"></i></a>
                                <span class="sep">/</span>
                                <select class="form-control form-control-sm d-inline-block w-auto"
                                        onchange="window.location.search='?lang=' + this.value;"
                                        aria-label="Language selector">
                                    <option value="ro" th:selected="${#locale.language == 'ro'}" th:text="#{lang.ro}">RO</option>
                                    <option value="en" th:selected="${#locale.language == 'en'}" th:text="#{lang.en}">EN</option>
                                    <option value="fr" th:selected="${#locale.language == 'fr'}" th:text="#{lang.fr}">FR</option>
                                    <option value="ru" th:selected="${#locale.language == 'ru'}" th:text="#{lang.ru}">RU</option>
                                </select>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <div class="nav-options">
                <div class="container">
                    <div class="nav-bar">
                        <div class="nav-left">
                            <button class="humberger-menu humberger-open" type="button" th:attr="aria-label=#{navbar.open.menu}">
                                <i class="fa fa-bars"></i>
                            </button>
                            <a href="/index" class="nav-logo">
                                <img class="site-logo" src="/img/skill-swap-logo-cameleon.png" alt="SkillSwap logo">
                            </a>
                        </div>
                        <div class="nav-center">
                            <div class="nav-menu">
                                <ul>
                                    <li><a th:href="@{/index}"><span th:text="#{navbar.home}">Acasă</span></a></li>
                                    <li><a th:href="@{/announces-list}"><span th:text="#{navbar.announces}">Anunțuri</span></a></li>
                                    <!--                    <li><a sec:authorize="isAuthenticated()" th:href="@{/chat}"><span>Chat</i></span></a></li>-->
                                    <li><a th:href="@{/contact}"><span th:text="#{navbar.contact}">Contact</span></a></li>
                                    <li><a sec:authorize="isAuthenticated()" th:href="@{/profile}"><span th:text="#{navbar.profile}">Profil</span></a></li>
                                </ul>
                            </div>
                            <a th:href="@{/announces/new}" class="btn-create-announce"><span th:text="#{navbar.create}">+ Creează anunț</span></a>
                            <div class="nav-right">
                                <!-- Conversations Button -->
                                <a th:href="@{/chat-history}" class="btn-conversations"
                                    sec:authorize="isAuthenticated()" th:attr="aria-label=#{navbar.conversations}">
                                    <i class="fa fa-comments"></i>
                                    <span class="conversation-badge" id="conversationBadge">2</span>
                                </a>

                                <!-- Notifications Button -->
                                <div class="notifications-wrapper" sec:authorize="isAuthenticated()">
                                    <button class="btn-notifications" type="button" id="notificationsButton"
                                        th:attr="aria-label=#{navbar.notifications}">
                                        <i class="fa fa-bell"></i>
                                        <span class="notification-badge" id="notificationBadge">3</span>
                                    </button>
                                    <!-- Notifications Dropdown -->
                                    <div class="notifications-dropdown" id="notificationsDropdown">
                                        <div class="notifications-header">
                                            <h6 th:text="#{navbar.notifications}">Notificări</h6>
                                        </div>
                                        <div class="notifications-list" id="notificationsList">
                                            <!-- Notification items will be dynamically inserted here -->
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="navbar-search-panel" id="navbarSearchPanel">
                    <form class="navbar-search-form" th:action="@{/announces-list}" method="get">
                        <!-- Folosește același endpoint de filtrare ca bara principală de căutare -->
                        <input type="text" id="navbar-search-input" name="query" th:attr="placeholder=#{navbar.search.placeholder}"
                            th:attrappend="aria-label=#{navbar.search.placeholder}">
                        <button type="submit" th:attr="aria-label=#{navbar.search.submit}">
                            <i class="fa fa-search"></i>
                        </button>
                    </form>
                </div>
            </div>
    </div>
    </header>
    <!-- Header End -->
    </div>

</body>

</html>
