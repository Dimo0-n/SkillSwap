<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Title</title>

    <style>
        .nav-options {
            background: linear-gradient(to bottom, #7b2cbf, #5a189a);
        }

        .nav-menu ul li a {
            background: linear-gradient(to bottom, #9d4edd, #7b2cbf);
        }

        .nav-menu ul li.active a {
            background: linear-gradient(to bottom, #c77dff, #9d4edd);
        }

    </style>

</head>
<body>

<div th:fragment="navbar">
<!-- Header Section Begin -->
<header class="header-section">
    <div class="ht-options">
        <div class="container">
            <div class="row">
                <div class="col-lg-6 col-md-8">
                    <div class="ht-widget">
                        <ul>
                            <li><i class="fa fa-clock-o"></i> <span id="current-date"></span></li>
                            <li class="signup-switch signup-open"><i class="fa fa-sign-out"></i> Login / Sign up</li>
                        </ul>
                    </div>
                </div>

                <script>
                    // Obține data actuală
                    const today = new Date();

                    // Formatează data (ex: Aug 16, 2025)
                    const options = { month: 'short', day: '2-digit', year: 'numeric' };
                    const formattedDate = today.toLocaleDateString('en-US', options);

                    // Afișează în span
                    document.getElementById('current-date').textContent = formattedDate;
                </script>

                <div class="col-lg-6 col-md-4">
                    <div class="ht-social">
                        <a href="#"><i class="fa fa-facebook"></i></a>
                        <a href="#"><i class="fa fa-twitter"></i></a>
                        <a href="#"><i class="fa fa-youtube-play"></i></a>
                        <a href="#"><i class="fa fa-instagram"></i></a>
                        <a href="#"><i class="fa fa-envelope-o"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="logo">
        <div class="container">
            <div class="row">
                <div class="col-lg-12 text-center">
                    <a href="/index"><img src="/img/skill-swap-logo.png" alt=""></a>
                </div>
            </div>
        </div>
    </div>
    <div class="nav-options">
        <div class="container">
            <div class="humberger-menu humberger-open">
                <i class="fa fa-bars"></i>
            </div>
            <div class="nav-search search-switch">
                <i class="fa fa-search"></i>
            </div>
            <div class="nav-menu">
                <ul>
                    <li class="active"><a href="/index"><span>Acasă</span></a></li>
                    <li><a href="/categories-grid"><span>Anunțuri</span></a></li>
                    <li><a href="/details-post-gallery"><span>Pages</i></span></a></li>
                    <li><a href="/details-post-default"><span>Chat</i></span></a></li>
                    <li><a href="/contact">Contact</a></li>
                    <li><a href="/details-post-review">Profil</a></li>
                </ul>
            </div>
        </div>
    </div>
</header>
<!-- Header End -->
</div>

</body>
</html>
