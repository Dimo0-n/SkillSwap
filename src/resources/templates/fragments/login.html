<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Register</title>
</head>
<body>
<div th:fragment="login">
    <div class="signup-section">
        <div class="signup-close"><i class="fa fa-close"></i></div>
        <div class="signup-text">
            <div class="container">
                <div class="signup-title">
                    <h2>Sign in</h2>
                    <p>Fill out the form below to recieve a free and confidential</p>
                </div>
                <form th:action="@{/login}" method="post" class="signup-form">
                    <div class="sf-input-list">
                        <input type="email" class="input-value" placeholder="Email" name="email" required>
                        <input type="password" class="input-value" placeholder="Password" name="password" required>
                    </div>
                    <button type="submit"><span>LOGIN</span></button>
                    <button type="button" class="button" id="go-to-register">
                        <span>GO TO REGISTER</span>
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
</body>
</html>
