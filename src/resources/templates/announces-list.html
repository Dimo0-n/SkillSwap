<!DOCTYPE html>
<html lang="zxx">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Amin Template">
    <meta name="keywords" content="Amin, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SkillSwap</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
</head>

<body>
<!-- Page Preloder -->
<div id="preloder">
    <div class="loader"></div>
</div>

<div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

<div th:replace="~{/fragments/navbar :: navbar}"></div>

<!-- Categories Grid Section Begin -->
<section class="categories-grid-section spad">
    <div class="container">

        <div class="row mb-4">
            <div class="col-12">
                <div class="section-title">
                    <h5>Hai cu un nou skill. Caută chiar aici</h5>
                </div>
                <input type="text" id="skill-search" class="form-control" placeholder="Scrie...">
            </div>
        </div>

        <div class="row" id="items-container">
            <th:block th:each="announce : ${announcesList}">
                <div class="col-lg-4 col-md-6 mb-4">
                    <div class="cg-item" data-skill="reviews">
                        <div class="cg-pic set-bg" th:attr="data-setbg=@{${'/' + announce.image}}">
                            <div class="label"><span>Reviews</span></div>
                        </div>
                        <div class="cg-text">
                            <h5><a th:text="${announce.title}" href="#"></a></h5>
                            <ul>
                                <li>by <span th:text="${announce.author}"></span></li>
                                <li>
                                    <i class="fa fa-clock-o"></i>
                                    <span th:text="${#temporals.format(announce.createDate, 'dd MMMM HH:mm')}"></span>
                                </li>
                                <li><i class="fa fa-comment-o"></i> 20</li>
                            </ul>
                            <p th:text="${announce.description}"></p>
                        </div>
                    </div>
                </div>
            </th:block>
        </div>

<!--        Paginarea start-->
        <div class="pagination-item mt-4 d-flex justify-content-center" id="pagination-container"></div>
<!--            Paginare end-->

    </div>
</section>
<!-- Categories Grid Section End -->

<div th:replace="~{/fragments/about :: about}"></div>

<script src="/js/jquery-3.3.1.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/jquery.magnific-popup.min.js"></script>
<script src="/js/circle-progress.min.js"></script>
<script src="/js/jquery.barfiller.js"></script>
<script src="/js/jquery.slicknav.js"></script>
<script src="/js/owl.carousel.min.js"></script>
<script src="/js/main.js"></script>
<script src="/js/categories-list.js"></script>

<style>
    /* Stiluri pentru paginare */
    .pagination-item {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 10px;
    }

    .pagination-item a {
        padding: 8px 12px;
        border: 1px solid #ddd;
        text-decoration: none;
        color: #333;
        border-radius: 4px;
        transition: all 0.3s ease;
    }

    .pagination-item a:hover {
        background-color: #f5f5f5;
        color: #000;
    }

    .pagination-item a.active {
        background-color: #812ACF;
        color: white;
        border-color: #812ACF;
    }

    .pagination-dots {
        padding: 8px 4px;
        color: #999;
    }

    #skill-search {
        padding: 12px;
        border: 2px solid #e1e1e1;
        border-radius: 6px;
        font-size: 16px;
        transition: border-color 0.3s ease;
    }

    #skill-search:focus {
        outline: none;
        border-color: #812ACF;
    }

    #results-info {
        text-align: center;
        display: block;
    }
</style>
</body>
</html>
