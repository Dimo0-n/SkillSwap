<!DOCTYPE html>
<html lang="ro"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Amin Template">
    <meta name="keywords" content="Amin, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SkillSwap</title>
    <link rel="icon" type="image/png" href="/img/tab-logo.png?v=2">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">

    <style>
        .cl-pic {
            position: relative;
            overflow: hidden;
        }

        /* FORM */
        .delete-overlay-form {
            position: absolute;
            top: 12px;
            left: 12px;
            z-index: 5;
        }

        /* BUTTON */
        .delete-overlay-btn {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: none;
            background: rgba(220, 53, 69, 0.9); /* red danger */
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(6px);
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }

        .delete-overlay-btn i {
            font-size: 14px;
        }

        .delete-overlay-btn:hover {
            background: #dc3545;
            transform: scale(1.15) rotate(-5deg);
        }

        /* optional: apare doar la hover pe imagine */
        .cl-pic .delete-overlay-form {
            opacity: 0;
            transform: scale(0.8);
            transition: all 0.2s ease;
        }

        .cl-pic:hover .delete-overlay-form {
            opacity: 1;
            transform: scale(1);
        }
    </style>
</head>

<body>
    <!-- Page Preloder -->
    <div id="preloder">
        <div class="loader"></div>
    </div>

    <div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

    <div th:replace="~{/fragments/navbar :: navbar}"></div>

    <!-- Categories list Section Begin -->
    <section class="categories-list-section spad">
        <div class="container">
            <div class="row">
                <div class="col-lg-8 p-0">
                    <th:block th:each="announce : ${announcesList}">
                        <a th:href="@{/announce-details/{id}(id=${announce.id})}" class="announce-link">
                        <div class="cl-item">
                            <div class="cl-pic">
                                <form th:action="@{/profile/user-announces-list/delete/{id}(id=${announce.id})}"
                                      method="post" class="delete-overlay-form">
                                    <button type="submit" class="delete-overlay-btn" th:attr="aria-label=#{user.announces.delete}">
                                        <i class="fa fa-trash"></i>
                                    </button>
                                </form>
                                <img th:src="@{${announce.imagePath}}" alt="SkillSwap">
                            </div>
                            <div class="cl-text">
                                <div class="label"><span th:text="#{user.announces.badge}">Reviews</span></div>
                                <h5>
                                    <a th:text="${announce.title}" href="#"></a> </h5>
                                <ul>
                                    <li><span th:text="#{index.by}">de</span> <span th:text="${announce.author}"></span></li>
                                    <li><i class="fa fa-clock-o"></i>
                                        <span th:text="${#temporals.format(announce.date, 'dd MMMM HH:mm')}"></span>
                                    </li>
                                </ul>
                                <p class="announce-desc" th:text="${announce.description}"></p>
                            </div>
                        </div>
                        </a>
                    </th:block>
                    <!--        Paginarea start-->
                    <div class="pagination-item mt-4 d-flex justify-content-center" id="pagination-container"></div>
                    <!--            Paginare end-->
                </div>

                <div class="col-lg-4 col-md-7 p-0">
                    <div class="sidebar-option">
                        <div th:replace="~{/fragments/social-media :: social-media}"></div>

                        <div th:replace="~{/fragments/adds :: adds}"></div>

                        <div th:replace="~{/fragments/trend :: trend}"></div>

                        <div th:replace="~{/fragments/subscribe :: subscribe}">
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
    <!-- Categories List Section End -->

    <div th:replace="~{/fragments/about :: about}"></div>

    <!-- Search model Begin -->
    <div class="search-model">
        <div class="h-100 d-flex align-items-center justify-content-center">
            <div class="search-close-switch">+</div>
            <form class="search-model-form">
                <input type="text" id="search-input" th:attr="placeholder=#{common.search.placeholder}">
            </form>
        </div>
    </div>
    <!-- Search model end -->

    <!-- Js Plugins -->
    <script src="/js/jquery-3.3.1.min.js"></script>
    <script src="/js/bootstrap.min.js"></script>
    <script src="/js/jquery.magnific-popup.min.js"></script>
    <script src="/js/circle-progress.min.js"></script>
    <script src="/js/jquery.barfiller.js"></script>
    <script src="/js/jquery.slicknav.js"></script>
    <script src="/js/owl.carousel.min.js"></script>
    <script src="/js/main.js"></script>
    <script src="/js/categories-list.js"></script>

    <style>
        /* Stiluri pentru paginare */
        .pagination-item {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        .pagination-item a {
            padding: 8px 12px;
            border: 1px solid #ddd;
            text-decoration: none;
            color: #333;
            border-radius: 4px;
            transition: all 0.3s ease;
        }

        .pagination-item a:hover {
            background-color: #f5f5f5;
            color: #000;
        }

        .pagination-item a.active {
            background-color: #812ACF;
            color: white;
            border-color: #812ACF;
        }

        .pagination-dots {
            padding: 8px 4px;
            color: #999;
        }

        #results-info {
            text-align: center;
            display: block;
        }
    </style>
</body>

</html>
