<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillSwap | Detalii anunț</title>

    <!-- Fonts & CSS (reuse site styles) -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">
</head>
<body>

<!-- Page Preloder -->
<div id="preloder"><div class="loader"></div></div>

<!-- Lateral menu + navbar fragments -->
<div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>
<div th:replace="~{/fragments/navbar :: navbar}"></div>

<!-- Announce Details Section -->
<section class="categories-grid-section spad">
    <div class="container">

        <div class="row mb-4">
            <div class="col-12">
                <div class="section-title">
                    <h5>Titlul anunțului</h5>
                </div>
            </div>
        </div>

        <div class="row">
            <!-- Main content -->
            <div class="col-lg-8">
                <div class="detail-card">
                    <div class="detail-image mb-3">
                        <img src="/img/skill/skill-programming.png" alt="Imagine anunț" class="img-fluid rounded"/>
                    </div>

                    <div class="detail-meta mb-2">
                        <ul>
                            <li>by <strong class="meta-author">Autor</strong></li>
                            <li><i class="fa fa-clock-o"></i> <span class="meta-date">data</span></li>
                            <li><i class="fa fa-tag"></i> <span class="meta-category">Categorie</span></li>
                        </ul>
                    </div>

                    <div class="detail-description">
                        <p>Descrierea anunțului va apărea aici.</p>
                    </div>

                    <div class="detail-actions mt-4">
                        <a href="/profil/" class="btn btn-outline-purple mr-2">Vezi profil</a>
                        <a href="/messages/new" class="btn btn-purple">Contactează</a>
                    </div>
                </div>
            </div>

            <!-- Sidebar -->
            <div class="col-lg-4">
                <div class="sidebar-card mb-4 p-4 rounded">
                    <div class="author-box text-center mb-3">
                        <img src="/img/profil/default-profile.png" alt="Autor" class="rounded-circle" style="width:100px;height:100px;object-fit:cover;"/>
                        <h5 class="mt-2 text-white">Autor</h5>
                        <p class="mb-1 text-white">Membru din <span>luna</span></p>
                        <a href="/profil/" class="btn btn-sm btn-outline-purple">Vezi profil complet</a>
                    </div>

                    <div class="contact-box mt-3">
                        <h6 class="text-white">Detalii contact</h6>
                        <p class="mb-1"><i class="fa fa-envelope"></i> <a href="mailto:contact@example.com">contact@example.com</a></p>
                        <p class="mb-1"><i class="fa fa-phone"></i> <span>+40 700 000 000</span></p>
                    </div>

                    <div class="tags-box mt-3">
                        <h6 class="text-white">Etichete</h6>
                        <div>
                            <a class="tag-pill mr-1" href="/announces-list">tag</a>
                        </div>
                    </div>
                </div>

                <!-- Related announces (reuse cg-item cards style) -->
                <div class="related-section">
                    <h6 class="mb-3 text-white">Anunțuri similare</h6>
                    <div class="row">
                        <th:block>
                            <div class="col-12 mb-3">
                                <div class="cg-item" style="display:flex;gap:10px;align-items:center;">
                                        <div class="cg-pic set-bg" style="width:100px;height:70px;overflow:hidden;flex:0 0 100px;">
                                        <img src="/img/skill/skill-programming.png" style="width:100%;height:100%;object-fit:cover;" alt="thumb"/>
                                    </div>
                                    <div class="cg-text" style="flex:1;padding-left:0;">
                                        <h6 class="mb-1 text-white"><a href="/announces/">Titlu</a></h6>
                                        <small class="text-muted">data</small>
                                    </div>
                                </div>
                            </div>
                        </th:block>
                    </div>
                </div>
            </div>
        </div>

    </div>
</section>

<!-- Footer fragment reused if available -->
<div th:replace="~{/fragments/about :: about}"></div>

<script src="/js/jquery-3.3.1.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/jquery.magnific-popup.min.js"></script>
<script src="/js/circle-progress.min.js"></script>
<script src="/js/jquery.barfiller.js"></script>
<script src="/js/jquery.slicknav.js"></script>
<script src="/js/owl.carousel.min.js"></script>
<script src="/js/main.js"></script>

<style>
    .detail-card { background: transparent; color: #fff; }
    .detail-meta ul { list-style: none; padding: 0; display:flex; gap:12px; color: #bdbdbd; }
    .detail-meta ul li { font-size: 14px; }
    .meta-author, .meta-date, .meta-category { color: #9d4edd; font-weight:600; }
    .detail-description p { font-size: 16px; line-height: 1.8; color: #ddd; }
    .sidebar-card { background: rgba(255,255,255,0.03); }
    .tag-pill { background: linear-gradient(90deg,#9d4edd,#7b2cbf); padding:6px 10px; color:white; border-radius:20px; text-decoration:none; display:inline-block; }

    /* Purple button variants */
    .btn-outline-purple { color: #cfa7ff; border-color: #9d4edd; background: transparent; }
    .btn-outline-purple:hover { color: #fff; background: linear-gradient(90deg,#9d4edd,#7b2cbf); border-color: #7b2cbf; }
    .btn-sm.btn-outline-purple { padding: .25rem .5rem; }
    .btn-purple { color: #fff; background: linear-gradient(90deg,#9d4edd,#7b2cbf); border: none; }
    .btn-purple:hover { opacity: .95; }

    .comments-section .comment { background: rgba(255,255,255,0.02); padding:10px; border-radius:6px; }

    /* Comments styling */
    .section-heading { font-family: 'Cinzel', serif; font-size:28px; color:#fff; letter-spacing:1px; }
    .comment-list { margin-top:20px; }
    .comment-item { border-bottom: 1px solid rgba(255,255,255,0.03); padding-bottom:18px; }
    .comment-author { font-family: 'Cinzel', serif; font-weight:700; text-transform:uppercase; color:#fff; font-size:16px; }
    .comment-date { color:#9b9b9b; font-size:13px; margin-top:2px; }
    .btn-reply { background:#222; color:#fff; border:none; padding:10px 16px; border-radius:2px; font-weight:700; }
    .btn-reply:hover { background:#2b2b2b; }
    .comment-text { color:#d0d0d0; line-height:1.8; margin-top:10px; }
    .comment-textarea { background:rgba(255,255,255,0.02); color:#e6e6e6; border:1px solid rgba(255,255,255,0.03); height:220px; resize:none; }
    .btn-submit { width:100%; background:#1f1f1f; color:#fff; border:none; padding:14px 20px; font-weight:700; }
    .btn-submit:hover { background:#2a2a2a; }
</style>

</body>
</html>
