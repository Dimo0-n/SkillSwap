<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.title} + ' - Skill Swap'">Register - Skill Swap</title>
    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/register.css" type="text/css">
</head>
<body>
<div class="register-container">
    <div style="text-align:right; margin-bottom:10px;">
        <a href="?lang=ro" th:text="#{lang.ro}">RO</a> |
        <a href="?lang=en" th:text="#{lang.en}">EN</a> |
        <a href="?lang=fr" th:text="#{lang.fr}">FR</a> |
        <a href="?lang=ru" th:text="#{lang.ru}">RU</a>
    </div>
    <button class="close-btn" onclick="window.location.href='/index'">&times;</button>

    <h2 class="register-title" th:text="#{register.title}">Register</h2>
    <div th:if="${error}" class="message error" th:text="${error}"></div>
    <div th:if="${success}" class="message success" th:text="${success}"></div>
    <form th:action="@{register/save}" id="registerForm">
        <div class="form-group">
            <label for="fullName" th:text="#{register.fullname}">Nume Complet</label>
            <input type="text" id="fullName" name="fullName" th:attr="placeholder=#{register.fullname.placeholder}" required>
        </div>

        <div class="form-group">
            <label for="email" th:text="#{register.email}">Email</label>
            <input type="email" id="email" name="email" th:attr="placeholder=#{register.email.placeholder}" required>
        </div>

        <div class="form-group">
            <label for="password" th:text="#{register.password}">Parolă</label>
            <input type="password" id="password" name="password" th:attr="placeholder=#{register.password.placeholder}" required>
        </div>

        <div class="form-group">
            <label for="confirmPassword" th:text="#{register.confirm}">Confirmați Parola</label>
            <input type="password" id="confirmPassword" name="confirmPassword" th:attr="placeholder=#{register.confirm.placeholder}" required>
        </div>

        <div class="checkbox-group">
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">
                <span th:text="#{register.accept}">Accept</span> <a href="#" onclick="showTerms()" th:text="#{register.terms}">termenii și condițiile</a>
            </label>
        </div>

        <button type="submit" class="register-btn" th:text="#{register.submit}">Creează Cont</button>

        <!-- Separator -->
        <div class="divider">
            <span th:text="#{register.or}">sau</span>
        </div>

        <!-- Google Register -->
        <a href="/oauth2/authorization/google" class="google-btn">
            <img src="https://developers.google.com/identity/images/g-logo.png" alt="Google">
            <span th:text="#{register.google}">Continuă cu Google</span>
        </a>

        <div class="login-link">
            <span th:text="#{register.have.account}">Ai deja un cont?</span> <a th:href="@{/login}" onclick="goToLogin()" th:text="#{register.login.link}">Conectează-te</a>
        </div>
    </form>
</div>

<div id="message" class="message"></div>

<script>
    function showMessage(text, type = 'error') {
        const messageDiv = document.getElementById('message');
        messageDiv.textContent = text;
        messageDiv.className = `message ${type}`;
        messageDiv.classList.add('show');

        setTimeout(() => {
            messageDiv.classList.remove('show');
        }, 4000);
    }

    function closeForm() {
        // Aici poți adăuga logica pentru închiderea formularului
        // De exemplu, ascunderea containerului sau redirecționarea
        document.querySelector('.register-container').style.opacity = '0';
        document.querySelector('.register-container').style.transform = 'scale(0.8)';

        setTimeout(() => {
            // Poți să ascunzi complet elementul sau să redirecționezi
            window.location.href = '#'; // sau pagina principală
        }, 300);
    }

    function showTerms() {
        showMessage('Termenii și condițiile vor fi afișate în curând.', 'success');
    }

    function goToLogin() {
        showMessage('Redirecționare către pagina de login...', 'success');
        // Aici poți adăuga logica de redirecționare
        setTimeout(() => {
            window.location.href = '#login'; // sau URL-ul paginii de login
        }, 1500);
    }

    document.getElementById('registerForm').addEventListener('submit', async function (e) {
        e.preventDefault();

        const fullName = document.getElementById('fullName').value.trim();
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;
        const confirmPassword = document.getElementById('confirmPassword').value;
        const terms = document.getElementById('terms').checked;

        // Validări client
        if (!fullName || fullName.length < 2) {
            showMessage('Numele complet trebuie să conțină cel puțin 2 caractere.');
            return;
        }

        if (!email || !email.includes('@')) {
            showMessage('Vă rugăm să introduceți o adresă de email validă.');
            return;
        }

        if (!password || password.length < 6) {
            showMessage('Parola trebuie să conțină cel puțin 6 caractere.');
            return;
        }

        if (password !== confirmPassword) {
            showMessage('Parolele nu se potrivesc.');
            return;
        }

        if (!terms) {
            showMessage('Trebuie să acceptați termenii și condițiile.');
            return;
        }

        // Trimitere la backend
        const formData = new FormData(this);

        try {
            const response = await fetch('/register/save', {
                method: 'POST',
                body: formData
            });

            const result = await response.text();

            if (response.ok) {
                showMessage('Cont creat cu succes! Vă rugăm să vă verificați emailul.', 'success');
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                showMessage(result, 'error'); // ex: "Acest email deja este înregistrat!"
            }
        } catch (err) {
            showMessage('A apărut o eroare de server. Încearcă mai târziu.', 'error');
        }
    });

    // Efect de focus pentru input-uri
    document.querySelectorAll('input').forEach(input => {
        input.addEventListener('focus', function() {
            this.parentElement.style.transform = 'scale(1.02)';
        });

        input.addEventListener('blur', function() {
            this.parentElement.style.transform = 'scale(1)';
        });
    });
</script>
</body>
</html>
