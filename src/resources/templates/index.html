<!DOCTYPE html>
<html lang="ro" xmlns:th="http://www.thymeleaf.org" th:attr="lang=${#locale.language}">

<head>
    <meta charset="UTF-8">
    <meta name="description" content="Amin Template">
    <meta name="keywords" content="Amin, unica, creative, html">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>SkillSwap</title>
    <link rel="icon" type="image/png" href="/img/tab-logo.png?v=2">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:300,400,500,600,700,800,900&display=swap"
          rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Cinzel:400,700,900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">

    <!-- Css Styles -->
    <link rel="stylesheet" href="/css/bootstrap.min.css" type="text/css">
    <link rel="stylesheet" href="/css/font-awesome.min.css" type="text/css">
    <link rel="stylesheet" href="/css/elegant-icons.css" type="text/css">
    <link rel="stylesheet" href="/css/owl.carousel.min.css" type="text/css">
    <link rel="stylesheet" href="/css/barfiller.css" type="text/css">
    <link rel="stylesheet" href="/css/magnific-popup.css" type="text/css">
    <link rel="stylesheet" href="/css/slicknav.min.css" type="text/css">
    <link rel="stylesheet" href="/css/style.css" type="text/css">

    <style>
        /* Hide hero section completely on mobile */
        @media (max-width: 768px) {
            section.hero-section {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                min-height: 0 !important;
                max-height: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
                overflow: hidden !important;
                background: none !important;
                background-image: none !important;
                opacity: 0 !important;
                position: relative !important;
                line-height: 0 !important;
            }
            
            section.hero-section *,
            section.hero-section *::before,
            section.hero-section *::after {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                width: 0 !important;
                background: none !important;
                background-image: none !important;
                opacity: 0 !important;
            }
            
            section.hero-section .container,
            section.hero-section .row,
            section.hero-section [class*="col-"] {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .hero-slider,
            .hero-slider.owl-carousel,
            .hero-slider .owl-stage-outer,
            .hero-slider .owl-stage,
            .hero-slider .owl-item,
            .hero-slider .hs-item,
            .hs-item,
            .hs-item.set-bg {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                width: 0 !important;
                overflow: hidden !important;
                background: none !important;
                background-image: none !important;
                opacity: 0 !important;
                position: absolute !important;
                left: -9999px !important;
                top: -9999px !important;
            }
            
            .hs-item::after {
                display: none !important;
                content: none !important;
            }
            
            .hs-text,
            .hs-text *,
            .hs-text .label,
            .hs-text h3 {
                display: none !important;
                visibility: hidden !important;
                height: 0 !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            
            .hero-slider.owl-carousel .owl-dots {
                display: none !important;
                visibility: hidden !important;
            }
        }
        
        .hs-item {
            position: relative;
        }

        .hs-item::after {
            content: "";
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.3); /* culoare + transparență */
            z-index: 1;
        }

        .hs-item > * {
            position: relative;
            z-index: 2; /* ca să fie textul peste overlay */
        }

        .ti-pic img {
            width: 60px !important;   /* lățimea dorită */
            height: auto !important;   /* păstrează proporțiile */
            display: block !important;
            margin-right: 10px !important; /* spatiu intre img si txt */
        }

        /*Pentru imaginile de la anunturi*/
        .ip-pic img {
            width: 370px !important;       /* lățimea dorită */
            height: 247px !important;      /* înălțimea dorită */
            object-fit: cover !important;  /* taie marginile dacă imaginea nu e exact proporțională */
        }


    </style>
</head>

<body>
<!-- Page Preloder -->
<div id="preloder">
    <div class="loader"></div>
</div>

<div th:replace="~{fragments/lateral-menu :: lateral-menu}"></div>

<div th:replace="~{/fragments/navbar :: navbar}"></div>

<!-- Hero Section Begin -->
<section class="hero-section">
    <div class="container">
        <div class="row">
            <div class="col-lg-6 col-md-6">
                <div class="hs-text">
                    <div class="label"><span th:text="#{index.hero.badge}">Începe acum</span></div>
                    <h3 th:text="#{index.hero.title}">Schimbă-ți cunoștințele și câștigă noi skill-uri</h3>
                    <div class="ht-meta">
                        <br>
                    </div>
                </div>
            </div>
            <div class="col-xl-4 col-lg-5 col-md-6 offset-lg-1 offset-xl-2">
                <div class="trending-post">
                    <div class="section-title">
                        <h5 th:text="#{index.try.now}">Încearcă acum</h5>
                    </div>
                    <div class="trending-slider owl-carousel">
                        <div class="single-trending-item">
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-programming.png" alt="programming">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.java}">Programare Java</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-guitar.png" alt="guitar">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.guitar}">Chitară acustică</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-photoshop.png" alt="photoshop">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.photoshop}">Editare Photoshop</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-english.png" alt="english">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.english}">Engleză conversațională</a></h6>
                                </div>
                            </div>
                        </div>

                        <div class="single-trending-item">
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-cooking.png" alt="cooking">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.cooking}">Gătit sănătos</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-public-speaking.png" alt="public speaking">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.speaking}">Public Speaking</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-photography.png" alt="photography">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.photo}">Fotografie</a></h6>
                                </div>
                            </div>
                            <div class="trending-item">
                                <div class="ti-pic">
                                    <img src="/img/skill/skill-dance.png" alt="dance">
                                </div>
                                <div class="ti-text">
                                    <h6><a href="#" th:text="#{index.skill.dance}">Dans modern</a></h6>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="hero-slider owl-carousel">
        <div class="hs-item set-bg" data-setbg="img/hero/img-bg-3.png"></div>
        <div class="hs-item set-bg" data-setbg="img/hero/img-bg-1.png"></div>
        <div class="hs-item set-bg" data-setbg="img/hero/img-bg-2.png"></div>
    </div>
</section>
<!-- Hero Section End -->

<!-- Instagram Post Section Begin -->
<section class="instagram-post-section spad">
    <div class="container">
        <div class="row">
            <div class="col-lg-8">
                <div class="section-title">
                    <h5 th:text="#{index.latest}">Anunțuri noi</h5>
                </div>

<!--                img 370 x 247-->

                <th:block th:each="announce : ${latest5Announces}">
                    <a th:href="@{/announce-details/{id}(id=${announce.id})}" class="announce-link">
                    <div class="ip-item">
                        <div class="ip-pic">
                            <img th:src="@{${announce.imagePath}}" alt="SkillSwap">
                        </div>
                        <div class="ip-text">
                            <div class="label"><span th:text="#{index.new}">NOU</span></div>
                            <h5>
                                <a th:text="${announce.title}" href="#"></a>
                            </h5>
                            <ul>
                                <li><span th:text="#{index.by}">de</span> <span th:text="${announce.author}"></span></li>
                                <li>
                                    <i class="fa fa-clock-o"></i>
                                    <span th:text="${#temporals.format(announce.date, 'dd MMMM HH:mm')}"></span>
                                </li>
                            </ul>
                            <p class="announce-desc" th:text="${announce.description}"></p>
                        </div>
                    </div>
                    </a>
                </th:block>

            </div>
            <div class="col-lg-4 col-md-7">
                <div class="sidebar-option">

                    <div th:replace="~{/fragments/social-media :: social-media}"></div>

                    <div th:replace="~{/fragments/adds :: adds}"></div>

                    <div th:replace="~{/fragments/trend :: trend}"></div>

                    <div th:replace="~{/fragments/subscribe :: subscribe}">

                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
<!-- Instagram Post Section End -->

<div th:replace="~{/fragments/about :: about}"></div>

<!-- Search model Begin -->
<div class="search-model">
    <div class="h-100 d-flex align-items-center justify-content-center">
        <div class="search-close-switch">+</div>
        <form class="search-model-form">
                <input type="text" id="search-input" th:attr="placeholder=#{index.search.placeholder}">
        </form>
    </div>
</div>
<!-- Search model end -->

<!-- Js Plugins -->
<script src="/js/jquery-3.3.1.min.js"></script>
<script src="/js/bootstrap.min.js"></script>
<script src="/js/jquery.magnific-popup.min.js"></script>
<script src="/js/circle-progress.min.js"></script>
<script src="/js/jquery.barfiller.js"></script>
<script src="/js/jquery.slicknav.js"></script>
<script src="/js/owl.carousel.min.js"></script>
<script src="/js/main.js"></script>
</body>

</html>
