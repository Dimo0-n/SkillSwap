spring.application.name=skillswap
#docker run --name skill-swap -e MYSQL_ROOT_PASSWORD=qwertyuiop -p 3310:3306 -d mysql:latest


#Brodicico123+++BR


spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.extra-dialects=security
spring.thymeleaf.cache=false
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:mysql://localhost:3310/skillswap_db
spring.datasource.username=root
spring.datasource.password=qwertyuiop

server.port=8080
server.address=0.0.0.0
logging.level.org.springframework.security=DEBUG
server.forward-headers-strategy=native

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
logging.level.org.flywaydb=INFO
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# spring.h2.console.enabled=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

#expirare sesiune
server.servlet.session.timeout=30m

#for Google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
deepseek.api.key=${DEEPSEEK_API_KEY}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/meetings.space.created
spring.security.oauth2.client.registration.google.redirect-uri=${GOOGLE_REDIRECT_URI:https://skillswap.codes/login/oauth2/code/google}

app.google.meet.base-url=https://meet.googleapis.com

management.endpoints.web.exposure.include=health,info,metrics,caches
management.metrics.enable.cache=true





